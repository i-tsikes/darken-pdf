[project]
name = "darken-pdf"
version = "0.1.0"
description = "Darken text in a PDF and add an invisible OCR text layer"
readme = "README.md"
authors = [
    { name = "Terry Sikes", email = "terry.l.sikes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false
